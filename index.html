<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Use Your Nose To Play Flappy Bird</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Courier New', monospace;
            color: #fff;
        }
        #container {
            display: flex;
            gap: 15px;
        }
        #gameCanvas {
            border: 2px solid #fff;
        }
        #sidePanel {
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 280px;
        }
        #webcamContainer {
            position: relative;
            width: 280px;
            height: 210px;
            border: 2px solid #fff;
        }
        #webcam {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
            filter: blur(12px);
        }
        #webcamCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transform: scaleX(-1);
        }
        #dataDisplay {
            font-size: 11px;
            line-height: 1.6;
            padding: 8px;
            border: 1px solid #333;
        }
        .data-row {
            display: flex;
            justify-content: space-between;
        }
        .data-value {
            font-weight: bold;
        }
        .meter {
            height: 20px;
            background: #111;
            border: 1px solid #333;
            position: relative;
        }
        .meter-fill {
            height: 100%;
            background: #fff;
            transition: width 0.05s;
        }
        .meter-label {
            position: absolute;
            top: 50%;
            left: 5px;
            transform: translateY(-50%);
            font-size: 10px;
            color: #888;
            z-index: 1;
        }
        .danger-zone {
            position: absolute;
            right: 0;
            top: 0;
            height: 100%;
            width: 20%;
            background: rgba(255,255,255,0.1);
            border-left: 1px dashed #666;
        }
        #startBtn {
            padding: 10px;
            font-size: 14px;
            background: #fff;
            color: #000;
            border: none;
            cursor: pointer;
            font-family: inherit;
        }
        #startBtn:hover { background: #ccc; }
        #status { font-size: 11px; color: #666; }
        #instructions {
            font-size: 10px;
            color: #444;
            line-height: 1.5;
        }
        #explosion {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: #fff;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.1s;
            z-index: 100;
        }
        #explosion.active { opacity: 1; }
    </style>
</head>
<body>
    <div id="explosion"></div>
    <div id="container">
        <canvas id="gameCanvas" width="360" height="540"></canvas>
        <div id="sidePanel">
            <div id="webcamContainer">
                <video id="webcam" autoplay playsinline></video>
                <canvas id="webcamCanvas"></canvas>
            </div>
            
            <div id="dataDisplay">
                <div class="data-row">
                    <span>SCORE</span>
                    <span class="data-value" id="scoreValue">0</span>
                </div>
                <div class="data-row">
                    <span>NOSE WIDTH</span>
                    <span class="data-value" id="noseWidthValue">0.000</span>
                </div>
                <div class="data-row">
                    <span>BASELINE</span>
                    <span class="data-value" id="baselineValue">0.000</span>
                </div>
                <div class="data-row">
                    <span>EXPANSION</span>
                    <span class="data-value" id="expansionValue">1.00x</span>
                </div>
                <div class="data-row">
                    <span>BREATH</span>
                    <span class="data-value" id="breathValue">0.00</span>
                </div>
                <div class="data-row">
                    <span>VOLUME</span>
                    <span class="data-value" id="volumeValue">0.00</span>
                </div>
                <div class="data-row">
                    <span>STATE</span>
                    <span class="data-value" id="stateValue">IDLE</span>
                </div>
            </div>

            <div class="meter">
                <span class="meter-label">NOSE</span>
                <div class="meter-fill" id="breathMeter" style="width: 0%"></div>
            </div>
            <div class="meter">
                <span class="meter-label">VOLUME</span>
                <div class="meter-fill" id="volumeMeter" style="width: 0%"></div>
                <div class="danger-zone"></div>
            </div>
            
            <div id="status">INIT...</div>
            <button id="startBtn">START</button>
            
            <div id="instructions">
                INHALE = UP / STOP = FALL / TOO LOUD = EXPLODE
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>

    <script>
        // ==================== ELEMENTS ====================
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const video = document.getElementById('webcam');
        const webcamCanvas = document.getElementById('webcamCanvas');
        const webcamCtx = webcamCanvas.getContext('2d');
        const startBtn = document.getElementById('startBtn');
        const statusEl = document.getElementById('status');
        const breathMeterEl = document.getElementById('breathMeter');
        const volumeMeterEl = document.getElementById('volumeMeter');
        const explosionEl = document.getElementById('explosion');

        // Data display elements
        const scoreValueEl = document.getElementById('scoreValue');
        const noseWidthValueEl = document.getElementById('noseWidthValue');
        const baselineValueEl = document.getElementById('baselineValue');
        const expansionValueEl = document.getElementById('expansionValue');
        const breathValueEl = document.getElementById('breathValue');
        const volumeValueEl = document.getElementById('volumeValue');
        const stateValueEl = document.getElementById('stateValue');

        // ==================== GAME STATE ====================
        let gameRunning = false;
        let score = 0;
        let bird = { x: 70, y: 270, velocity: 0, size: 20 };
        let pipes = [];
        let pipeTimer = 0;
        
        // Detection data
        let isBreathing = false;
        let breathIntensity = 0;
        let audioVolume = 0;
        let noseWidth = 0;
        let baselineNoseWidth = 0;
        let calibrationFrames = 0;
        const CALIBRATION_COUNT = 30;
        
        // Nose landmarks for drawing
        let noseLandmarks = null;
        
        // Thresholds - MORE SENSITIVE
        const VOLUME_THRESHOLD = 0.008;
        const VOLUME_DANGER = 0.5;
        const NOSE_SENSITIVITY = 1.03;

        // ==================== AUDIO ====================
        let audioContext, analyser, microphone, audioDataArray;

        async function setupAudio() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioContext.createAnalyser();
                analyser.fftSize = 256;
                microphone = audioContext.createMediaStreamSource(stream);
                microphone.connect(analyser);
                audioDataArray = new Uint8Array(analyser.frequencyBinCount);
                return true;
            } catch (err) {
                console.error('Audio error:', err);
                return false;
            }
        }

        function getAudioVolume() {
            if (!analyser) return 0;
            analyser.getByteFrequencyData(audioDataArray);
            let sum = 0;
            for (let i = 0; i < audioDataArray.length; i++) {
                sum += audioDataArray[i];
            }
            return sum / (audioDataArray.length * 255);
        }

        // ==================== FACE MESH ====================
        let faceMesh, camera;

        async function setupFaceMesh() {
            // Set webcam canvas size
            webcamCanvas.width = 280;
            webcamCanvas.height = 210;

            faceMesh = new FaceMesh({
                locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
            });
            
            faceMesh.setOptions({
                maxNumFaces: 1,
                refineLandmarks: true,
                minDetectionConfidence: 0.5,
                minTrackingConfidence: 0.5
            });

            faceMesh.onResults(onFaceResults);

            camera = new Camera(video, {
                onFrame: async () => {
                    await faceMesh.send({ image: video });
                },
                width: 280,
                height: 210
            });
            
            await camera.start();
        }

        function onFaceResults(results) {
            // Clear webcam overlay
            webcamCtx.clearRect(0, 0, webcamCanvas.width, webcamCanvas.height);

            if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
                const landmarks = results.multiFaceLandmarks[0];
                
                // Nose landmarks
                // 129: left nostril, 358: right nostril
                // 98: left nose wing outer, 327: right nose wing outer
                // 2: nose bottom, 1: nose tip
                const leftNostril = landmarks[129];
                const rightNostril = landmarks[358];
                const leftWingOuter = landmarks[98];
                const rightWingOuter = landmarks[327];
                const noseBottom = landmarks[2];
                const noseTip = landmarks[1];
                
                // Store for drawing
                noseLandmarks = {
                    leftNostril, rightNostril,
                    leftWingOuter, rightWingOuter,
                    noseBottom, noseTip
                };
                
                // Calculate nose width
                const currentNoseWidth = Math.sqrt(
                    Math.pow(rightNostril.x - leftNostril.x, 2) +
                    Math.pow(rightNostril.y - leftNostril.y, 2)
                );
                
                // Calibration
                if (calibrationFrames < CALIBRATION_COUNT) {
                    baselineNoseWidth = (baselineNoseWidth * calibrationFrames + currentNoseWidth) / (calibrationFrames + 1);
                    calibrationFrames++;
                    statusEl.textContent = `CALIBRATING ${Math.round(calibrationFrames/CALIBRATION_COUNT*100)}%`;
                } else {
                    noseWidth = currentNoseWidth;
                    const expansion = noseWidth / baselineNoseWidth;
                    breathIntensity = Math.max(0, (expansion - 1) * 25);
                    
                    // Update data display
                    noseWidthValueEl.textContent = noseWidth.toFixed(4);
                    baselineValueEl.textContent = baselineNoseWidth.toFixed(4);
                    expansionValueEl.textContent = expansion.toFixed(3) + 'x';
                    breathValueEl.textContent = breathIntensity.toFixed(2);
                    
                    breathMeterEl.style.width = Math.min(100, breathIntensity * 50) + '%';
                    
                    if (calibrationFrames === CALIBRATION_COUNT) {
                        statusEl.textContent = 'READY';
                    }
                }
                
                // Draw nose landmarks on webcam
                drawNoseLandmarks();
            }
        }

        function drawNoseLandmarks() {
            if (!noseLandmarks) return;
            
            const w = webcamCanvas.width;
            const h = webcamCanvas.height;
            
            // Draw all nose points
            const points = [
                { p: noseLandmarks.leftNostril, r: 6, label: 'L' },
                { p: noseLandmarks.rightNostril, r: 6, label: 'R' },
                { p: noseLandmarks.leftWingOuter, r: 4, label: '' },
                { p: noseLandmarks.rightWingOuter, r: 4, label: '' },
                { p: noseLandmarks.noseBottom, r: 3, label: '' },
                { p: noseLandmarks.noseTip, r: 3, label: '' }
            ];
            
            // Draw connecting lines
            webcamCtx.strokeStyle = '#0f0';
            webcamCtx.lineWidth = 1;
            webcamCtx.beginPath();
            webcamCtx.moveTo(noseLandmarks.leftWingOuter.x * w, noseLandmarks.leftWingOuter.y * h);
            webcamCtx.lineTo(noseLandmarks.leftNostril.x * w, noseLandmarks.leftNostril.y * h);
            webcamCtx.lineTo(noseLandmarks.noseBottom.x * w, noseLandmarks.noseBottom.y * h);
            webcamCtx.lineTo(noseLandmarks.rightNostril.x * w, noseLandmarks.rightNostril.y * h);
            webcamCtx.lineTo(noseLandmarks.rightWingOuter.x * w, noseLandmarks.rightWingOuter.y * h);
            webcamCtx.stroke();
            
            // Line between nostrils (the measurement we're using)
            webcamCtx.strokeStyle = isBreathing ? '#0f0' : '#666';
            webcamCtx.lineWidth = 2;
            webcamCtx.beginPath();
            webcamCtx.moveTo(noseLandmarks.leftNostril.x * w, noseLandmarks.leftNostril.y * h);
            webcamCtx.lineTo(noseLandmarks.rightNostril.x * w, noseLandmarks.rightNostril.y * h);
            webcamCtx.stroke();
            
            // Draw points
            points.forEach(({p, r, label}) => {
                const x = p.x * w;
                const y = p.y * h;
                
                // Outer circle
                webcamCtx.strokeStyle = '#0f0';
                webcamCtx.lineWidth = 2;
                webcamCtx.beginPath();
                webcamCtx.arc(x, y, r, 0, Math.PI * 2);
                webcamCtx.stroke();
                
                // Inner dot
                webcamCtx.fillStyle = isBreathing ? '#0f0' : '#060';
                webcamCtx.beginPath();
                webcamCtx.arc(x, y, r - 2, 0, Math.PI * 2);
                webcamCtx.fill();
            });
            
            // Breathing indicator around nose
            if (isBreathing) {
                const cx = (noseLandmarks.leftNostril.x + noseLandmarks.rightNostril.x) / 2 * w;
                const cy = (noseLandmarks.leftNostril.y + noseLandmarks.rightNostril.y) / 2 * h;
                const radius = 25 + breathIntensity * 5;
                
                webcamCtx.strokeStyle = '#0f0';
                webcamCtx.lineWidth = 2;
                webcamCtx.setLineDash([4, 4]);
                webcamCtx.beginPath();
                webcamCtx.arc(cx, cy, radius, 0, Math.PI * 2);
                webcamCtx.stroke();
                webcamCtx.setLineDash([]);
            }
        }

        // ==================== GAME LOGIC ====================
        function updateGame() {
            if (!gameRunning) return;
            
            audioVolume = getAudioVolume();
            volumeMeterEl.style.width = Math.min(100, audioVolume * 200) + '%';
            volumeValueEl.textContent = audioVolume.toFixed(3);
            
            isBreathing = (breathIntensity > 0.1) || (audioVolume > VOLUME_THRESHOLD);
            stateValueEl.textContent = isBreathing ? 'INHALE' : 'IDLE';
            
            if (audioVolume > VOLUME_DANGER) {
                explode();
                return;
            }
            
            if (isBreathing) {
                const lift = Math.min(breathIntensity * 2 + audioVolume * 5, 4);
                bird.velocity = -lift - 2.5;
            } else {
                bird.velocity += 0.5;
            }
            
            bird.y += bird.velocity;
            
            if (bird.y < 0) bird.y = 0;
            if (bird.y > canvas.height - bird.size) {
                gameOver();
                return;
            }
            
            pipeTimer++;
            if (pipeTimer > 90) {
                pipeTimer = 0;
                const gapY = 120 + Math.random() * 300;
                pipes.push({
                    x: canvas.width,
                    gapY: gapY,
                    gapHeight: 130,
                    width: 50,
                    passed: false
                });
            }
            
            for (let i = pipes.length - 1; i >= 0; i--) {
                pipes[i].x -= 2.5;
                
                if (pipes[i].x < -pipes[i].width) {
                    pipes.splice(i, 1);
                    continue;
                }
                
                if (!pipes[i].passed && pipes[i].x + pipes[i].width < bird.x) {
                    pipes[i].passed = true;
                    score++;
                    scoreValueEl.textContent = score;
                }
                
                if (checkCollision(bird, pipes[i])) {
                    gameOver();
                    return;
                }
            }
        }

        function checkCollision(bird, pipe) {
            const br = bird.x + bird.size;
            const bb = bird.y + bird.size;
            
            if (br > pipe.x && bird.x < pipe.x + pipe.width) {
                if (bird.y < pipe.gapY - pipe.gapHeight/2 || 
                    bb > pipe.gapY + pipe.gapHeight/2) {
                    return true;
                }
            }
            return false;
        }

        function explode() {
            gameRunning = false;
            explosionEl.classList.add('active');
            stateValueEl.textContent = 'EXPLODED';
            setTimeout(() => {
                explosionEl.classList.remove('active');
                startBtn.textContent = 'RETRY';
                startBtn.style.display = 'block';
            }, 300);
        }

        function gameOver() {
            gameRunning = false;
            stateValueEl.textContent = 'DEAD';
            statusEl.textContent = `GAME OVER - SCORE: ${score}`;
            startBtn.textContent = 'RETRY';
            startBtn.style.display = 'block';
        }

        // ==================== RENDER ====================
        function render() {
            // Clear
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Pipes
            ctx.fillStyle = '#fff';
            pipes.forEach(pipe => {
                ctx.fillRect(pipe.x, 0, pipe.width, pipe.gapY - pipe.gapHeight/2);
                ctx.fillRect(pipe.x, pipe.gapY + pipe.gapHeight/2, pipe.width, canvas.height);
            });
            
            // Bird (nose shape)
            ctx.save();
            ctx.translate(bird.x + bird.size/2, bird.y + bird.size/2);
            ctx.rotate(Math.min(Math.max(bird.velocity * 0.04, -0.4), 0.4));
            
            // Nose outline
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.ellipse(0, 0, bird.size/2, bird.size/1.5, 0, 0, Math.PI * 2);
            ctx.stroke();
            
            // Nostrils
            const ns = isBreathing ? 4 : 2;
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(-5, 4, ns, 0, Math.PI * 2);
            ctx.arc(5, 4, ns, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.restore();
            
            // Score
            ctx.fillStyle = '#fff';
            ctx.font = '24px Courier New';
            ctx.textAlign = 'center';
            ctx.fillText(score, canvas.width/2, 40);
            
            // Breathing indicator
            if (isBreathing && gameRunning) {
                ctx.font = '12px Courier New';
                ctx.fillText('↑', canvas.width/2, 60);
            }
            
            // Danger warning
            if (audioVolume > VOLUME_DANGER * 0.7) {
                ctx.fillStyle = `rgba(255,255,255,${audioVolume * 0.5})`;
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }
        }

        function gameLoop() {
            updateGame();
            render();
            requestAnimationFrame(gameLoop);
        }

        // ==================== INIT ====================
        async function init() {
            statusEl.textContent = 'INIT...';
            await setupAudio();
            await setupFaceMesh();
            gameLoop();
        }

        function startGame() {
            if (calibrationFrames < CALIBRATION_COUNT) {
                statusEl.textContent = 'WAIT FOR CALIBRATION';
                return;
            }
            
            score = 0;
            bird = { x: 70, y: 270, velocity: 0, size: 20 };
            pipes = [];
            pipeTimer = 0;
            gameRunning = true;
            scoreValueEl.textContent = '0';
            startBtn.style.display = 'none';
            statusEl.textContent = 'PLAYING';
        }

        startBtn.addEventListener('click', startGame);
        init();
    </script>
</body>
</html>
