<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ffffff" />
    <meta
      name="description"
      content="Ducklexander GitHub site with project links."
    />
    <title>Ducklexander - Home</title>
    <style>
      :root {
        --ink: #222;
        --muted: #555;
        --line: #d9ded6;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #fff;
        color: var(--ink);
        font: 15px/1.5 Arial, Helvetica, sans-serif;
      }

      .card {
        text-align: center;
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 30px 36px;
      }

      h1 {
        margin: 0 0 14px;
        font-size: 30px;
        letter-spacing: -0.4px;
      }

      p {
        margin: 0 0 14px;
        color: var(--muted);
      }

      a {
        color: #2e5f8a;
        text-decoration: none;
        border-bottom: 1px solid transparent;
      }

      a:hover {
        border-bottom-color: currentColor;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Ducklexander</h1>
      <p>Here are some Github Projects:</p>
      <p><a href="/sobtoplayflappybird/">Sob to Play Flappy Bird</a></p>
    </main>
  </body>
</html>
